name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app to prevent auto-sleep
        run: |
          URL="https://orit-ratings.streamlit.app"

          STATUS=$(curl -sS -o /tmp/body.html -w "%{http_code}" \
            -A "Mozilla/5.0 (compatible; keep-alive-bot)" \
            -L --max-time 60 \
            "$URL")

          echo "HTTP $STATUS"
          echo "Body head:"
          head -c 800 /tmp/body.html
          echo ""

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Streamlit app pinged successfully"
          else
            echo "Ping failed with status $STATUS"
            exit 1
          fi
