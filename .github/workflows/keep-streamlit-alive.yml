name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app (no redirect follow)
        run: |
          URL="https://orit-ratings.streamlit.app"

          STATUS=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --max-time 90 \
            "$URL")

          echo "HTTP $STATUS"
          echo "Body head:"
          head -c 400 /tmp/body.txt
          echo ""

          if [ -n "$STATUS" ] && [ "$STATUS" != "000" ]; then
            echo "Streamlit responded with HTTP $STATUS — app is alive"
          else
            echo "No HTTP response received"
            exit 1
          fi

      - name: Ping health endpoint (no redirect follow)
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --max-time 60 \
            "https://orit-ratings.streamlit.app/_stcore/health")

          echo "health: HTTP $STATUS"
